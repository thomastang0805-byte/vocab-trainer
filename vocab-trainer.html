function clone(){return JSON.parse(JSON.stringify(db));}
function parseCSV(text){
 text=text.replace(/^\uFEFF/,'');let rows=[],row=[],field='',quoted=false,closed=false;
 for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'){if(text[i+1]==='"'){field+='"';i++;}else{quoted=false;closed=true;}}else field+=c;}
 else if(c==='"'){if(field||closed)throw Error('CSV 引号格式不正确');quoted=true;}
 else if(c===','||c==='\n'||c==='\r'){row.push(field);field='';closed=false;if(c!==','){rows.push(row);row=[];if(c==='\r'&&text[i+1]==='\n')i++;}}
 else{if(closed&&c.trim())throw Error('CSV 引号后存在多余字符');if(!closed)field+=c;}}
 if(quoted)throw Error('CSV 引号未闭合');if(field||row.length||closed){row.push(field);rows.push(row);}
 rows=rows.filter(r=>r.some(v=>v.trim()));const header=rows.shift()?.map(x=>x.trim());if(!header||header.join(',')!=='word,zh,section')throw Error('CSV 列必须为 word,zh,section');
 const seen=new Set();return rows.map((r,i)=>{if(r.length!==3||r.some(v=>!v.trim()))throw Error(`CSV 第 ${i+2} 行缺失字段`);const [word,zh,section]=r.map(x=>x.trim()),id=JSON.stringify([word,zh,section]);if(seen.has(id))throw Error(`CSV 第 ${i+2} 行重复`);seen.add(id);return createWord({word,zh,section});});
}
function replaceVocabulary(words){const next=fresh();next.words=words;if(db)next.settings={...db.settings};if(!save(next))return false;notify(`已导入 ${words.length} 个词。`);show('home');return true;}
function initializeBuiltin(replace=false){if(replace&&!confirm('恢复内置词库会覆盖词库，并清空学习记录、Day 配额与日报。继续吗？'))return;replaceVocabulary(BUILTIN_VOCAB.map(createWord));}
function importCustomCSV(){

 input.click();
}
function renderImport(){$('view').innerHTML='<div class="eyebrow">GET STARTED</div><h1>你的数学词库已就绪</h1><p class="subtitle">内置 145 个词，无需联网。也可导入包含 word,zh,section 三列的自定义 CSV。</p><div class="actions"><button id="retry" class="primary">使用内置词库</button><button id="custom-csv">导入自定义 CSV</button></div>';$('retry').onclick=()=>initializeBuiltin();$('custom-csv').onclick=importCustomCSV;}
function dayInfo(){return db.days[db.settings.day]||{newIds:[]};}
function reviewWords(now=Date.now()){return db.words.filter(w=>w.history.length&&(w.wrongCount>=2||w.due<=now)).sort((a,b)=>(b.wrongCount>=2)-(a.wrongCount>=2)||a.due-b.due);}
function shuffled(arr){const out=[...arr];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out;}
function overlap(a,b){a=a.toLocaleLowerCase().trim();b=b.toLocaleLowerCase().trim();return a.includes(b)||b.includes(a);}
function makeOptions(w,prev=[]){const candidates=shuffled(db.words.filter(x=>x.section===w.section&&x.id!==w.id&&x.zh!==w.zh&&!overlap(x.word,w.word)&&!prev.some(p=>p.id===x.id||p.zh===x.zh)));for(let i=0;i<candidates.length;i++)for(let j=i+1;j<candidates.length;j++){const a=candidates[i],b=candidates[j];if(a.zh!==b.zh&&!overlap(a.word,b.word))return shuffled([w,a,b]);}return null;}
function show(name){if(db?.session&&name!=='study'){notify('请先结束当前 session，再查看设置或日报。');return;}clearInterval(clock);screen=name;question=null;locked=false;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.id==='nav-'+name));if(!db){renderImport();return;}$('day-badge').textContent='DAY '+String(db.settings.day).padStart(2,'0');({home:renderHome,settings:renderSettings,study:renderQuestion,report:renderReport}[name]||renderHome)();}
function renderHome(){const learned=db.words.filter(w=>w.history.length).length,used=dayInfo().newIds.length,quota=Math.max(0,db.settings.limit-used),due=reviewWords().length;
 $('view').innerHTML=`<div class="eyebrow">DAILY PRACTICE / DAY ${esc(db.settings.day)}</div><h1>每天一点，熟悉每一个词。</h1><p class="subtitle">先巩固，再前进。用三秒钟，把数学语言变成直觉。</p><div class="card hero"><div><h2>今天，从一次专注开始</h2><p>高危词优先 → 到期复习 → 今日新词。<br>随时结束，进度会自动保存在本地。</p><div class="actions"><button id="start" class="primary" ${!due&&!quota?'disabled':''}>开始今日训练 &nbsp; ↗</button><span class="tiny muted">今日剩余 ${quota} 个新词名额</span></div></div><div class="hero-symbol">ƒ(x)</div></div><div class="stats"><div class="stat"><span class="label">待复习 / 含高危词</span><span class="value">${due}</span><span class="tiny muted">先唤醒已有记忆</span></div><div class="stat"><span class="label">Day ${db.settings.day} 新词进度</span><span class="value">${used}<span class="tiny muted"> / ${db.settings.limit}</span></span><span class="tiny muted">多次训练累计计数</span></div><div class="stat"><span class="label">累计接触词汇</span><span class="value">${learned}<span class="tiny muted"> / ${db.words.length}</span></span><span class="tiny muted">一步一步，持续积累</span></div></div><div class="card"><div class="row"><h3>你的词库</h3><span class="tiny muted">${db.words.length} WORDS</span></div><div class="progress"><span style="width:${learned/db.words.length*100}%"></span></div><div class="section-grid">${[...new Set(db.words.map(w=>w.section))].map(s=>`<span class="section-tag">${esc(s)} · ${db.words.filter(w=>w.section===s).length}</span>`).join('')}</div></div>`;
 $('start').onclick=startSession;
}
function renderSettings(){const s=db.settings;$('view').innerHTML=`<div class="eyebrow">PREFERENCES</div><h1>按你的节奏学习。</h1><p class="subtitle">Day 为手动学习日编号；跨午夜不会自动推进。</p><form id="settings" class="card"><h2>训练设置</h2><label>每天新词上限<input id="limit" type="number" min="1" max="10000" step="1" required value="${s.limit}"></label><label>当前 Day<input id="day" type="number" min="1" max="100000" step="1" required value="${s.day}"></label><p class="help">切回已有 Day 会沿用该 Day 的新词计数。到期复习使用真实时间，不受 Day 编号影响。</p><button class="primary" type="submit">保存设置</button></form><div class="card" style="margin-top:20px"><h2>词库与数据</h2><p class="muted">已内置 145 个词，无需联网。可选导入含 word,zh,section 三列的 CSV，导入后会覆盖词库及学习记录。建议先导出 JSON 备份。</p><div class="actions"><button id="backup">导出 JSON 备份</button><button id="reimport">导入自定义 CSV</button></div></div><details style="margin-top:24px"><summary>调度规则</summary><p class="help">EF 初始 2.5、最低 1.3。快速答对：reps + 1，基础间隔 1、3、7、16、35 天乘以本次 EF；后续为上一间隔 × EF。3–6 秒答对：本次间隔增量减半，至少 1 天。失败（选错或超过 6 秒）：reps 归零，10 分钟后复习，累计错误 + 1。快速答对后 EF + 0.1，慢答后 EF − 0.14，失败后 EF − 0.2。累计错误 ≥ 2 的词每次 session 强制出现一次。</p></details>`;
 $('settings').onsubmit=e=>{e.preventDefault();const limit=Number($('limit').value),day=Number($('day').value);if(!Number.isInteger(limit)||limit<1||limit>10000||!Number.isInteger(day)||day<1||day>100000){notify('请输入有效的正整数。');return;}const n=clone();n.settings={limit,day};if(save(n)){notify('设置已保存。');show('settings');}};$('reimport').onclick=importCustomCSV;$('backup').onclick=exportBackup;
}
function startSession(){const remaining=Math.max(0,db.settings.limit-dayInfo().newIds.length),reviews=reviewWords(),news=db.words.filter(w=>!w.history.length).slice(0,remaining),n=clone();n.session={id:Date.now(),day:db.settings.day,startedAt:Date.now(),pending:[...reviews.map(w=>({id:w.id,type:'review',forced:w.wrongCount>=2})),...news.map(w=>({id:w.id,type:'new',forced:false}))],answers:[],prev:[]};if(!n.session.pending.length){notify('当前没有待学词。可稍后复习或在设置中调整 Day。');return;}if(save(n)){notify();show('study');}}
function renderQuestion(){const s=db.session;if(!s)return show('home');if(!s.pending.length)return finishSession();const item=s.pending[0],w=db.words.find(w=>w.id===item.id),options=makeOptions(w,s.prev);
 if(!options){$('view').innerHTML=`<h1>本题暂无可用干扰项</h1><p class="subtitle">${esc(w.word)} 所在 section 无法同时满足不同释义、不与上一题选项重复、英文不互为子串的规则。请结束 session 并检查词库。</p><button id="finish" class="primary">结束并查看日报</button>`;$('finish').onclick=finishSession;return;}
 const count=s.answers.length,total=count+s.pending.length;question={word:w,item,options,started:performance.now()};locked=false;
 $('view').innerHTML=`<div class="row"><div><div class="eyebrow">FOCUS SESSION</div><h2 style="margin:8px 0">${item.forced?'高危词强化':item.type==='review'?'到期复习':'学习新词'}</h2></div><button id="finish" class="small quiet">结束训练</button></div><div class="row tiny muted" style="margin:16px 0 8px"><span>已完成 ${count} / ${total}</span><span>先复习 · 后新词</span></div><div class="progress" role="progressbar" aria-label="训练进度" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${count}"><span style="width:${count/total*100}%"></span></div><div class="card question"><div class="row"><span class="pill">${esc(w.section)}</span><span id="timer" class="timer green" aria-label="答题计时">0.0 s</span></div><div class="word" lang="en">${esc(w.word)}</div><span class="tiny muted">选择正确的中文释义</span></div><div class="options">${options.map((o,i)=>`<button class="option" data-index="${i}"><span class="key">${i+1}</span><span>${esc(o.zh)}</span></button>`).join('')}</div><div id="feedback" aria-live="polite"></div><div class="actions"><button id="next" class="primary" hidden>下一题 →</button></div><p class="tiny muted">绿色 &lt;3s · 黄色 3–6s · 选错或 &gt;6s 按失败调度</p>`;
 $('finish').onclick=()=>{if(locked&&question?.failed&&performance.now()<question.unlockAt){notify('请先查看正确答案，2 秒后可结束。');return;}finishSession();};document.querySelectorAll('.option').forEach(b=>b.onclick=()=>answer(Number(b.dataset.index)));$('next').onclick=()=>{notify();show('study');};clock=setInterval(()=>{if(!question||locked)return;const t=(performance.now()-question.started)/1000;const el=$('timer');if(el){el.textContent=t.toFixed(1)+' s';el.className='timer '+(t<3?'green':t<=6?'yellow':'red');}},80);
 // Start the clock only after the question and answer buttons have been rendered.
 question.started=performance.now();
}
function schedule(w,correct,seconds,now){const fast=correct&&seconds<3,success=correct&&seconds<=6;let interval=w.interval;if(success){const reps=w.reps+1;const target=reps<=5?BASE[reps-1]*w.ef:Math.max(1,w.interval*w.ef);interval=fast?target:Math.max(1,w.interval+Math.max(0,target-w.interval)/2);w.reps=reps;w.interval=interval;w.due=now+interval*DAY;w.ef=Math.max(1.3,Number((w.ef+(fast?.1:-.14)).toFixed(2)));}else{w.reps=0;w.interval=0;w.due=now+600000;w.wrongCount++;w.ef=Math.max(1.3,Number((w.ef-.2).toFixed(2)));}return {fast,success};}
function answer(index){if(!question||locked)return;const q=question,seconds=(performance.now()-q.started)/1000,correct=q.options[index].id===q.word.id,now=Date.now(),n=clone(),w=n.words.find(w=>w.id===q.word.id),result=schedule(w,correct,seconds,now),record={id:w.id,word:w.word,zh:w.zh,section:w.section,type:q.item.type,correct,success:result.success,fast:result.fast,seconds,at:now,day:n.session.day,chosen:q.options[index].zh};w.history.push(record);n.session.answers.push(record);n.session.pending.shift();n.session.prev=q.options.map(o=>({id:o.id,zh:o.zh}));if(q.item.type==='new'){const d=n.days[n.session.day]||(n.days[n.session.day]={newIds:[]});if(!d.newIds.includes(w.id))d.newIds.push(w.id);}if(!save(n))return;locked=true;clearInterval(clock);q.failed=!result.success;q.unlockAt=performance.now()+(q.failed?2000:0);
 document.querySelectorAll('.option').forEach((b,i)=>{b.disabled=true;if(q.options[i].id===q.word.id)b.classList.add('correct');else if(i===index)b.classList.add('incorrect');});const color=result.fast?'green':result.success?'yellow':'red';$('timer').className='timer '+color;$('timer').textContent=seconds.toFixed(2)+' s';const msg=result.fast?'答对了，记忆很敏捷。':result.success?'答对了，再熟悉一点就更好了。':correct?'选对了，但超过 6 秒，按失败复习。':'这次记住，下次就会。';$('feedback').className='feedback '+color;$('feedback').innerHTML=`<strong>${msg}</strong><br>正确答案：${esc(w.zh)} · ${result.success?`${Number(w.interval.toFixed(2))} 天后复习`:'10 分钟后复习'}${q.failed?'<br><span id="wait" class="tiny">请查看正确答案，2 秒后可继续。</span>':''}`;
 $('next').hidden=false;$('next').textContent=n.session.pending.length?'下一题 →':'完成，查看日报 →';$('next').disabled=q.failed;$('finish').disabled=q.failed;if(q.failed){feedbackTimer=setTimeout(()=>{if(screen==='study'&&locked){$('next').disabled=false;$('finish').disabled=false;$('wait').textContent='可以继续了。';}},2000);}
}
function finishSession(){clearInterval(clock);clearTimeout(feedbackTimer);const n=clone(),s=n.session;if(!s)return show('home');const report={id:s.id,day:s.day,startedAt:s.startedAt,endedAt:Date.now(),answers:s.answers,dayNew:(n.days[s.day]?.newIds||[]).length,limit:n.settings.limit,totalLearned:n.words.filter(w=>w.history.length).length,totalWords:n.words.length,highRisk:riskWords(n.words)};n.reports.push(report);n.session=null;if(save(n)){notify();show('report');}}
function riskWords(words){return words.map(w=>({word:w.word,zh:w.zh,section:w.section,wrongCount:w.wrongCount,avg:w.history.length?w.history.reduce((a,h)=>a+h.seconds,0)/w.history.length:0})).filter(w=>w.wrongCount>=2||w.avg>5).sort((a,b)=>b.wrongCount-a.wrongCount||b.avg-a.avg).slice(0,5);}
function metrics(r){const a=r.answers,n=a.length;return {n,news:a.filter(x=>x.type==='new').length,reviews:a.filter(x=>x.type==='review').length,accuracy:n?a.filter(x=>x.correct).length/n*100:0,avg:n?a.reduce((s,x)=>s+x.seconds,0)/n:0,fast:n?a.filter(x=>x.fast).length/n*100:0,errors:a.filter(x=>!x.success)};}
function reportText(r){const m=metrics(r),groups=Object.groupBy?Object.groupBy(m.errors,x=>x.section):m.errors.reduce((o,x)=>((o[x.section]??=[]).push(x),o),{});return [`VCE 数学词汇日报 · Day ${r.day}`,new Date(r.endedAt).toLocaleString(),'本次 session（非整日汇总）',`新学 ${m.news} / 复习 ${m.reviews}`,`正确率 ${m.accuracy.toFixed(1)}%（按选项正确计）`,`平均反应时 ${m.avg.toFixed(2)} 秒`,`3秒达标率 ${m.fast.toFixed(1)}%（答对且 <3 秒 / 全部作答）`,`Day 进度 ${r.dayNew}/${r.limit}；累计学习 ${r.totalLearned}/${r.totalWords}`, '错词（含超时）：',...Object.entries(groups).map(([s,ws])=>`${s}: ${ws.map(w=>`${w.word} → ${w.zh}${w.correct?'（超时）':''}`).join('；')}`),...(!m.errors.length?['无']:[]),'高危词 Top 5（累计）：',...r.highRisk.map(w=>`${w.word} [${w.section}] · 错 ${w.wrongCount} 次 · 均时 ${w.avg.toFixed(2)}s`),...(!r.highRisk.length?['无']:[])].join('\n');}
function renderReport(){const r=db.reports.at(-1);if(!r){$('view').innerHTML='<div class="eyebrow">SESSION REPORT</div><h1>你的进步，值得记录。</h1><p class="subtitle">完成一次训练后，这里会生成日报。</p><button id="go-home" class="primary">开始学习</button>';$('go-home').onclick=()=>show('home');return;}const m=metrics(r),groups=m.errors.reduce((o,w)=>((o[w.section]??=[]).push(w),o),{}),stats=[['本次新学',m.news+'','个词'],['本次复习',m.reviews+'','个词'],['正确率',m.accuracy.toFixed(1)+'%','按选项正确计，含超时选对'],['平均反应时',m.avg.toFixed(2)+'s','全部已作答题目'],['3秒达标率',m.fast.toFixed(1)+'%','答对且 <3 秒 / 全部作答'],['Day '+r.day+' 进度',r.dayNew+'/'+r.limit,'当日累计新词']];
 $('view').innerHTML=`<div class="eyebrow">SESSION REPORT / DAY ${r.day}</div><h1>每一次练习，都在积累。</h1><p class="subtitle">${esc(new Date(r.endedAt).toLocaleString())} · 本次 session 日报${m.n?'':' · 本次未作答'}</p><div class="stats report-stats">${stats.map(([l,v,h])=>`<div class="stat"><span class="label">${esc(l)}</span><span class="value">${esc(v)}</span><span class="tiny muted">${esc(h)}</span></div>`).join('')}</div><div class="card"><div class="row"><h3>Day ${r.day} 新词进度</h3><span class="tiny muted">${r.dayNew} / ${r.limit}</span></div><div class="progress"><span style="width:${Math.min(100,r.dayNew/r.limit*100)}%"></span></div><p class="help">累计接触 ${r.totalLearned} / ${r.totalWords} 个词。Day 手动推进；到期时间按真实时间计算。</p></div><div class="report-grid"><div class="card"><h2>错词 · 按 section</h2><p class="help">含选错与超过 6 秒的作答。</p>${Object.entries(groups).map(([s,ws])=>`<h3>${esc(s)}</h3><ul class="word-list">${ws.map(w=>`<li>${esc(w.word)}<small>${esc(w.zh)} · ${w.seconds.toFixed(2)}s${w.correct?' · 超时':''}</small></li>`).join('')}</ul>`).join('')||'<div class="empty">本次没有错词，继续保持。</div>'}</div><div class="card"><h2>高危词 Top 5</h2><p class="help">累计错误 ≥2 次或历史平均反应时 &gt;5 秒。</p><ul class="word-list">${r.highRisk.map(w=>`<li>${esc(w.word)} <span class="pill">${esc(w.section)}</span><small>${esc(w.zh)} · 错 ${w.wrongCount} 次 · 均时 ${w.avg.toFixed(2)}s</small></li>`).join('')||'<li class="empty">暂无高危词。</li>'}</ul></div></div><div class="actions"><button id="copy" class="primary">复制日报为纯文本</button><button id="backup">导出 JSON 备份</button><button id="home">继续学习</button><button id="next-day">进入下一 Day</button></div><textarea id="copy-fallback" aria-label="日报纯文本（可手动复制）" hidden readonly style="width:100%;height:220px;margin-top:20px"></textarea>`;
 $('copy').onclick=async()=>{try{await navigator.clipboard.writeText(reportText(r));notify('日报已复制。');}catch{const t=$('copy-fallback');t.hidden=false;t.value=reportText(r);t.select();notify('浏览器未允许自动复制，已选中日报文本，请手动复制。');}};$('backup').onclick=exportBackup;$('home').onclick=()=>show('home');$('next-day').onclick=()=>{const n=clone();n.settings.day=Math.max(n.settings.day,r.day)+1;if(save(n)){notify('已进入 Day '+n.settings.day+'。');show('home');}};
}
function exportBackup(){const blob=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`vocab-trainer-day-${db.settings.day}-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function validateStored(d){if(d?.version!==1||!Array.isArray(d.words)||!d.words.length||!d.settings||!Number.isInteger(d.settings.limit)||d.settings.limit<1||!Number.isInteger(d.settings.day)||d.settings.day<1||!d.days||!Array.isArray(d.reports))throw Error('本地数据结构不完整');const ids=new Set();for(const w of d.words){if(typeof w.id!=='string'||ids.has(w.id)||!['word','zh','section'].every(k=>typeof w[k]==='string'&&w[k].trim())||!Array.isArray(w.history)||!['ef','interval','reps','due','wrongCount'].every(k=>Number.isFinite(w[k])&&w[k]>=0))throw Error('本地词库损坏');ids.add(w.id);}if(d.session&&(!Array.isArray(d.session.pending)||!Array.isArray(d.session.answers)||!Array.isArray(d.session.prev)||d.session.pending.some(x=>!ids.has(x.id))))throw Error('本地 session 损坏');return d;}
async function init(){for(const name of ['home','report','settings'])$('nav-'+name).onclick=()=>show(name);let raw;try{raw=localStorage.getItem(KEY);}catch{notify('浏览器禁止访问 localStorage，请允许本地存储后重试。');renderImport();return;}if(raw){try{db=validateStored(JSON.parse(raw));show(db.session?'study':'home');}catch(e){notify(e.message+'。未自动覆盖原始数据；请先下载保留，再重新导入。');$('view').innerHTML='<h1>本地数据无法读取</h1><button id="raw">下载原始数据</button> <button id="reset">恢复内置词库</button> <button id="custom-csv">导入自定义 CSV</button>';$('raw').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([raw],{type:'application/json'}));a.download='vocab-trainer-recovery.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};$('reset').onclick=()=>initializeBuiltin(true);$('custom-csv').onclick=importCustomCSV;}}else initializeBuiltin();}
document.addEventListener('keydown',e=>{if(screen!=='study'||e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;if(['1','2','3'].includes(e.key)){e.preventDefault();answer(Number(e.key)-1);}else if(e.key==='Enter'&&locked&&$('next')&&!$('next').disabled){e.preventDefault();$('next').click();}});
init();
</script>
