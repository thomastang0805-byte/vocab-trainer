  if(!Array.isArray(d.sentences)){d.sentences=[];changed=true;}
  const oldWordCount=d.words.length,oldSentenceCount=d.sentences.length;
  d.words=d.words.filter(x=>x&&typeof x==='object'&&typeof x.word==='string'&&typeof x.zh==='string'&&typeof (x.section||x.sec)==='string').map(x=>{const base=createEalWord({word:x.word,zh:x.zh,sec:x.sec||x.section});return {...base,...x,id:x.id||base.id,section:x.section||x.sec,history:Array.isArray(x.history)?x.history:[]};});

  if(!d.days||typeof d.days!=='object'||Array.isArray(d.days)){d.days={};changed=true;}
  if(!d.sentenceDays||typeof d.sentenceDays!=='object'||Array.isArray(d.sentenceDays)){d.sentenceDays={};changed=true;}
  if(!Array.isArray(d.reports)){d.reports=[];changed=true;}
  if(!d.stageDays||typeof d.stageDays!=='object'||Array.isArray(d.stageDays)){d.stageDays={};changed=true;}

  if(!Number.isInteger(d.settings.day)||d.settings.day<1){d.settings.day=1;changed=true;}

function createSentence(row){return {id:JSON.stringify([row.en,row.sec||row.section]),en:row.en,zh:row.zh,section:row.sec||row.section,ef:2.5,interval:0,reps:0,due:0,wrongCount:0,history:[]};}

function saveSentences(next=sdb){try{localStorage.setItem(SENTENCE_KEY,JSON.stringify(next));sdb=next;return true;}catch{notify('句子数据无法保存，请检查浏览器存储或先导出备份。单词数据未改动。');return false;}}
function cloneSentences(){return JSON.parse(JSON.stringify(sdb));}
function validateSentenceData(d){
 const ids=new Set();
 if(d.version!==1||!Number.isInteger(d.settings?.limit)||d.settings.limit<1||d.settings.limit>10000||!Array.isArray(d.sentences)||!d.sentences.length||!d.days||!Array.isArray(d.reports))throw Error('句子数据结构不完整');

}function makeSentenceOptions(target){const options=[target],seen=new Set([target.zh.trim()]);for(const pool of [shuffled(sdb.sentences.filter(s=>s.section===target.section&&s.id!==target.id)),shuffled(sdb.sentences.filter(s=>s.id!==target.id))]){
  for(const candidate of pool){if(seen.has(candidate.zh.trim()))continue;seen.add(candidate.zh.trim());options.push(candidate);if(options.length===3)return shuffled(options);}
 }
 return null;
}

function reportTabs(){return `<div class="actions report-tabs" role="tablist" aria-label="日报类型" style="margin:0 0 26px"><button id="word-report-tab" role="tab" aria-selected="${reportTab==='word'}" class="${reportTab==='word'?'primary':''}">单词日报</button><button id="sentence-report-tab" role="tab" aria-selected="${reportTab==='sentence'}" class="${reportTab==='sentence'?'primary':''}">句子日报</button></div>`;}
function renderReport(){if(reportTab==='sentence')renderSentenceReport();else renderWordReport();$('view').insertAdjacentHTML('afterbegin',reportTabs());$('word-report-tab').onclick=()=>{reportTab='word';show('report');};$('sentence-report-tab').onclick=()=>{reportTab='sentence';show('report');};}
function renderSentenceSettings(){return `<div class="card" style="margin-top:20px"><h2>句子训练设置与数据</h2><form id="sentence-settings"><label>每天新句上限<input id="sentence-limit" type="number" min="1" max="10000" step="1" required value="${sdb?.settings.limit||6}"></label><p class="help">默认 6 句；按浏览器本地自然日累计，与单词 Day、新词配额及阶段测完全隔离。句子训练不使用语音；上方朗读和听音设置仅用于单词模块。</p><button class="primary" type="submit">保存句子设置</button></form><div class="actions"><button id="sentence-settings-backup">导出句子 JSON 备份</button><button id="reset-sentences">重置句子学习数据</button></div></div>`;}
function bindSentenceSettings(){
 $('sentence-settings').onsubmit=e=>{e.preventDefault();if(!sdb){notify('句子数据不可用，请先检查句子模块。');return;}const limit=Number($('sentence-limit').value);if(!Number.isInteger(limit)||limit<1||limit>10000)return;const n=cloneSentences();n.settings={...n.settings,limit};if(saveSentences(n))notify('每天新句上限已保存，单词设置未改动。');};
 $('sentence-settings-backup').onclick=exportSentenceBackup;$('reset-sentences').onclick=resetSentenceLearning;
}
function downloadJSON(value,name){downloadText(JSON.stringify(value,null,2),name);}
function downloadText(text,name){const url=URL.createObjectURL(new Blob([text],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportSentenceBackup(){if(!sdb)return;downloadJSON({...sdb,exportedAt:new Date().toISOString()},`vce-sentences-${localDate()}.json`);}
function resetSentenceLearning(){if(!sdb||!confirm('重置所有句子学习记录、每日计数和句子日报？句库、每天新句上限、单词数据及其语音设置均保留。'))return;const n=cloneSentences();n.sentences=n.sentences.map(createSentence);n.days={};n.session=null;n.reports=[];if(saveSentences(n)){notify('句子学习数据已重置，单词数据未改动。');show('settings');}}

function exportBackup(){const blob=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`vocab-trainer-day-${db.settings.day}-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
// Remove only the two retired built-in entries; retain every other word's scheduling/history.
const RETIRED_WORD_IDS=new Set(['tangent line','normal line'].map((word,i)=>JSON.stringify([word,i===0?'切线':'法线','18A'])));
function migrateRetiredWords(d){
 if(!d.words.some(w=>RETIRED_WORD_IDS.has(w.id)))return false;
 d.words=d.words.filter(w=>!RETIRED_WORD_IDS.has(w.id));
 for(const day of Object.values(d.days))if(Array.isArray(day.newIds))day.newIds=day.newIds.filter(id=>!RETIRED_WORD_IDS.has(id));
 if(d.session){
  d.session.pending=d.session.pending.filter(x=>!RETIRED_WORD_IDS.has(x.id));
  d.session.answers=d.session.answers.filter(x=>!RETIRED_WORD_IDS.has(x.id));
  d.session.prev=d.session.prev.filter(x=>!RETIRED_WORD_IDS.has(x.id));
  if(RETIRED_WORD_IDS.has(d.session.correction?.id))d.session.correction=null;
  if(RETIRED_WORD_IDS.has(d.session.listeningReview?.id))d.session.listeningReview=null;
 }
 // Completed reports are historical snapshots; they do not feed future question queues.
 return true;
}
function migrateBuiltinVocabulary(d){
 const present=new Set(d.words.map(w=>w.id));let changed=false;
 for(const row of BUILTIN_VOCAB){const word=createWord(row);if(!present.has(word.id)){d.words.push(word);present.add(word.id);changed=true;}}
 return changed;
}
function validateStored(d){if(d?.version!==1||!Array.isArray(d.words)||!d.words.length||!d.settings||!Number.isInteger(d.settings.limit)||d.settings.limit<1||!Number.isInteger(d.settings.day)||d.settings.day<1||!d.days||!Array.isArray(d.reports))throw Error('本地数据结构不完整');const ids=new Set();for(const w of d.words){if(typeof w.id!=='string'||ids.has(w.id)||!['word','zh','section'].every(k=>typeof w[k]==='string'&&w[k].trim())||!Array.isArray(w.history)||!['ef','interval','reps','due','wrongCount'].every(k=>Number.isFinite(w[k])&&w[k]>=0))throw Error('本地词库损坏');ids.add(w.id);}if(d.stageHistory!==undefined&&!Array.isArray(d.stageHistory))throw Error('阶段测历史损坏');if(d.stageDays!==undefined&&(!d.stageDays||typeof d.stageDays!=='object'||Array.isArray(d.stageDays)))throw Error('阶段测日期记录损坏');if(d.session&&((d.session.round!==undefined&&(!Number.isInteger(d.session.round)||d.session.round<0||d.session.round>2))||!Array.isArray(d.session.pending)||!Array.isArray(d.session.answers)||!Array.isArray(d.session.prev)||d.session.pending.some(x=>!ids.has(x.id))||(d.session.correction&&(!ids.has(d.session.correction.id)||!Number.isFinite(d.session.correction.unlockAt)||!Number.isFinite(d.session.correction.seconds)))||(d.session.listeningReview&&(!ids.has(d.session.listeningReview.id)||![0,1,2].includes(d.session.listeningReview.remaining)||!Number.isFinite(d.session.listeningReview.unlockAt)||!Number.isFinite(d.session.listeningReview.notBefore)||typeof d.session.listeningReview.token!=='string'))))throw Error('本地 session 损坏');return d;}
async function init(){setupSpeech();for(const name of ['home','report','settings'])$('nav-'+name).onclick=()=>show(name);$('nav-sentences').onclick=()=>show(sdb?.session?'sentenceStudy':'sentences');$('nav-eal').onclick=()=>show(ealDb?.session?'ealStudy':'ealHome');let raw;try{raw=localStorage.getItem(KEY);}catch{notify('浏览器禁止访问 localStorage，请允许本地存储后重试。');renderImport();return;}if(raw){try{db=validateStored(JSON.parse(raw));db.stageHistory??=[];db.stageDays??={};db.settings={autoRead:true,speechRate:1,speechVoiceId:'',...db.settings};db.settings.modeWeights={...configuredModeWeights()};const retiredChanged=migrateRetiredWords(db),vocabularyChanged=migrateBuiltinVocabulary(db);if(retiredChanged||vocabularyChanged)save();show(db.session?'study':sdb?.session?'sentenceStudy':'home');}catch(e){notify(e.message+'。未自动覆盖原始数据；请先下载保留，再重新导入。');$('view').innerHTML='<h1>本地数据无法读取</h1><button id="raw">下载原始数据</button> <button id="reset">恢复内置词库</button> <button id="custom-csv">导入自定义 CSV</button>';$('raw').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([raw],{type:'application/json'}));a.download='vocab-trainer-recovery.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};$('reset').onclick=()=>initializeBuiltin(true);$('custom-csv').onclick=importCustomCSV;}}else initializeBuiltin();}
document.addEventListener('keydown',e=>{if(screen==='sentenceStudy'&&!e.repeat&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!e.isComposing&&!e.target.matches('input,textarea,select')){if(['1','2','3'].includes(e.key)){e.preventDefault();answerSentence(Number(e.key)-1);}else if(e.key==='Enter'&&sentenceLocked&&$('sentence-next')&&!$('sentence-next').disabled){e.preventDefault();$('sentence-next').click();}return;}if(screen!=='study'||e.repeat||e.ctrlKey||e.metaKey||e.altKey||e.isComposing||e.target.matches('input,textarea,select'))return;if(['1','2','3'].includes(e.key)){e.preventDefault();answer(Number(e.key)-1);}else if(e.key==='Enter'&&locked&&$('next')&&!$('next').disabled){e.preventDefault();$('next').click();}});
function initSentenceData(){
 try{
  const raw=localStorage.getItem(SENTENCE_KEY);
  if(raw===null){const initial=freshSentences();sdb=initial;saveSentences(initial);return Promise.resolve(sdb);}
  const d=validateSentenceData(JSON.parse(raw)),changed=migrateSentenceMeanings(d);
  validateSentenceData(d);sdb=d;if(changed)saveSentences(d);
 }catch(error){sentenceLoadError=error?.message||'句子模块初始化失败';sdb=null;}
 return Promise.resolve(sdb);
}
function initializeAllModules(){
 let sentenceReady=Promise.resolve();
 try{sentenceReady=initSentenceData();}catch(error){sdb=null;sentenceLoadError=error?.message||'句子模块初始化失败';console.error('Sentence module skipped',error);}
 try{initEalData();}catch(error){ealDb=null;console.error('EAL module skipped',error);}
 Promise.resolve(sentenceReady).then(()=>init()).then(()=>{
  if(ealDb?.session&&!db?.session&&!sdb?.session&&screen!=='ealStudy')show('ealStudy');
  else if(sdb?.session&&!db?.session&&screen!=='sentenceStudy')show('sentenceStudy');
 }).catch(error=>{
  console.error('Vocabulary module startup failed',error);
  notify('数学词库暂时无法读取；句子和EAL模块仍可分别使用。');
  try{$('nav-home').onclick=()=>show('home');$('nav-sentences').onclick=()=>show(sdb?.session?'sentenceStudy':'sentences');$('nav-eal').onclick=()=>show(ealDb?.session?'ealStudy':'ealHome');$('view').innerHTML='<h1>单词数据暂不可用</h1><p>数学词库初始化失败。请检查浏览器存储；句子和EAL模块仍可分别进入。</p><button id="retry-vocab">重试单词模块</button>';$('retry-vocab').onclick=()=>{try{init();}catch(e){console.error(e);}};}catch(renderError){console.error('Startup fallback render failed',renderError);}
 });
}
try{initializeAllModules();}catch(error){
 console.error('Application initialization failed',error);
 try{notify('程序初始化遇到问题，请刷新页面重试。');$('view').innerHTML='<h1>程序暂时无法启动</h1><p>刷新页面可重试。其他模块数据不会被清除。</p>';}catch(renderError){console.error('Fatal startup fallback failed',renderError);}
}
</script>
